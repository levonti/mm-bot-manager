image: python:3.14-slim

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - security
  - release

variables:
  GIT_DEPTH: "0"
  DOCKERHUB_IMAGE: levonti17/mm-bot-manager
  HELM_VERSION: v3.17.3
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  POSTGRES_DB: mm_bot_manager_test
  POSTGRES_USER: mm_bot_test
  # Disposable CI service only; no password or production credential is needed.
  POSTGRES_HOST_AUTH_METHOD: trust
  MM_TEST_POSTGRES_DSN: "postgresql://mm_bot_test@postgres:5432/mm_bot_manager_test"

verify:
  stage: verify
  rules:
    - when: on_success
  services:
    - name: postgres:15-alpine
      alias: postgres
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
    - |
      case "$(uname -m)" in
        x86_64) helm_arch=amd64 ;;
        aarch64) helm_arch=arm64 ;;
        *) echo "Unsupported CI architecture" >&2; exit 1 ;;
      esac
      helm_archive="helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
      curl --fail --silent --show-error --location "https://get.helm.sh/${helm_archive}" --output "/tmp/${helm_archive}"
      curl --fail --silent --show-error --location "https://get.helm.sh/${helm_archive}.sha256sum" --output "/tmp/${helm_archive}.sha256sum"
      (cd /tmp && sha256sum --check "${helm_archive}.sha256sum")
      tar -xzf "/tmp/${helm_archive}" -C /tmp
      install -m 0755 "/tmp/linux-${helm_arch}/helm" /usr/local/bin/helm
      helm version --short
    - pip install --no-cache-dir uv==0.11.7
    - uv sync --frozen --extra postgres
  script:
    - uv run --no-sync python scripts/check_translations.py
    - uv run --no-sync python scripts/release.py check
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        git -c http.sslCAInfo="${CI_SERVER_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}" fetch origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        uv run --no-sync python scripts/release.py check --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git -c http.sslCAInfo="${CI_SERVER_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}" fetch origin "$CI_DEFAULT_BRANCH"
        git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD
      fi
    - uv run --no-sync ruff check src tests scripts/check_translations.py scripts/release.py scripts/check_runtime_security.py
    - uv run --no-sync ruff format --check src tests scripts/check_translations.py scripts/release.py scripts/check_runtime_security.py
    - uv run --no-sync mypy src scripts/check_runtime_security.py
    - helm lint deploy/helm/mm-bot-manager
    - uv run --no-sync pytest -q --cov=mm_bot_manager --cov-branch --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Keep full reports, including findings without an upstream fix. Only fixable
# HIGH/CRITICAL findings block the pipeline; scanner/network errors also fail.
.trivy:
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  cache:
    key: trivy-0.76.1
    paths:
      - .trivy-cache/
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: 15m
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-*.json
      - trivy-*.txt

scan-dependencies:
  extends: .trivy
  stage: verify
  script:
    - trivy fs --scanners vuln --include-dev-deps --skip-dirs .venv --skip-dirs .uv-cache --skip-dirs .trivy-cache --skip-dirs .worktrees --format json --output trivy-dependencies.json .
    - trivy convert --scanners vuln --format table --output trivy-dependencies.txt trivy-dependencies.json
    - trivy fs --scanners vuln --include-dev-deps --skip-dirs .venv --skip-dirs .uv-cache --skip-dirs .trivy-cache --skip-dirs .worktrees --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

# Stable release tags only; malformed tags are still rejected by verify.
.release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

package-release:
  extends: .release-tag
  stage: package
  before_script:
    - pip install --no-cache-dir uv==0.11.7
    - uv sync --frozen --extra postgres
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl
    - |
      case "$(uname -m)" in
        x86_64) helm_arch=amd64 ;;
        aarch64) helm_arch=arm64 ;;
        *) exit 1 ;;
      esac
      helm_archive="helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
      curl -fsSL "https://get.helm.sh/${helm_archive}" -o "/tmp/${helm_archive}"
      curl -fsSL "https://get.helm.sh/${helm_archive}.sha256sum" -o "/tmp/${helm_archive}.sha256sum"
      (cd /tmp && sha256sum --check "${helm_archive}.sha256sum")
      tar -xzf "/tmp/${helm_archive}" -C /tmp
      install -m 0755 "/tmp/linux-${helm_arch}/helm" /usr/local/bin/helm
  script:
    - uv run --no-sync python scripts/release.py check
    - uv build --no-sources
    - helm package deploy/helm/mm-bot-manager --destination dist
    - uv run --no-sync python scripts/release.py notes --output release-notes.md
    - sha256sum dist/* > SHA256SUMS
    - mv SHA256SUMS dist/
    - echo "RELEASE_ARTIFACT_JOB_ID=$CI_JOB_ID" > package.env
  artifacts:
    expire_in: never
    paths:
      - dist/
      - release-notes.md
    reports:
      dotenv: package.env

# Requires a runner configured for privileged Docker-in-Docker with TLS.
build-release-image:
  extends: .release-tag
  stage: package
  resource_group: stable-release-image
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache jq
  script:
    - |
      : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in GitLab CI/CD variables}"
      : "${DOCKERHUB_TOKEN:?Set DOCKERHUB_TOKEN in GitLab CI/CD variables}"
      : "${DOCKERHUB_IMAGE:?Set DOCKERHUB_IMAGE in GitLab CI/CD variables}"
      printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
    - |
      version="${CI_COMMIT_TAG#v}"
      # Guard accidental overwrite; enforce immutable version tags in registry settings too.
      for release_tag in "$version" "$CI_COMMIT_TAG"; do
        if docker manifest inspect "$DOCKERHUB_IMAGE:$release_tag" > /tmp/manifest.out 2> /tmp/manifest.err; then
          echo "Release image tag already exists; refusing to overwrite" >&2
          exit 1
        elif ! grep -Eqi 'no such manifest|manifest unknown' /tmp/manifest.err; then
          echo "Cannot establish release image tag absence; refusing to publish" >&2
          exit 1
        fi
      done
      docker buildx build --push --platform linux/amd64 \
        --build-arg "APP_VERSION=$version" \
        --build-arg "MM_BUILD_REVISION=$CI_COMMIT_SHA" \
        --tag "$DOCKERHUB_IMAGE:$version" \
        --tag "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG" \
        --tag "$DOCKERHUB_IMAGE:sha-$CI_COMMIT_SHA" \
        --metadata-file build-metadata.json .
      digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' build-metadata.json)"
      printf 'RELEASE_IMAGE=%s@%s\n' "$DOCKERHUB_IMAGE" "$digest" > image.env
    - >-
      docker run --rm -i --platform linux/amd64 --network none --read-only
      --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      --cap-drop ALL --security-opt no-new-privileges:true
      "$DOCKERHUB_IMAGE@$digest" python -I - < scripts/check_runtime_security.py
  artifacts:
    expire_in: never
    paths:
      - build-metadata.json
    reports:
      dotenv: image.env

scan-release-image:
  extends:
    - .trivy
    - .release-tag
  stage: security
  needs:
    - job: build-release-image
      artifacts: true
  script:
    - test -n "$RELEASE_IMAGE"
    - trivy image --image-src remote --platform linux/amd64 --scanners vuln --format json --output trivy-image.json "$RELEASE_IMAGE"
    - trivy convert --scanners vuln --format table --output trivy-image.txt trivy-image.json
    - trivy image --image-src remote --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$RELEASE_IMAGE"

publish-release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: package-release
      artifacts: true
    - job: build-release-image
      artifacts: true
    - job: scan-release-image
      artifacts: false
  script:
    - test -n "$RELEASE_IMAGE"
    - printf '\nCommit `%s`\n\nContainer `%s`\n' "$CI_COMMIT_SHA" "$RELEASE_IMAGE" >> release-notes.md
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'mm-bot-manager $CI_COMMIT_TAG'
    description: release-notes.md
    assets:
      links:
        - name: Python packages, Helm chart and SHA256SUMS
          url: '$CI_PROJECT_URL/-/jobs/$RELEASE_ARTIFACT_JOB_ID/artifacts/download'
