services:
  mm-bot-manager:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_URL: ${MM_URL}
      MM_TOKEN: ${MM_TOKEN}
      MM_BOT_TOKEN: ${MM_BOT_TOKEN}
      MM_APPROVERS: ${MM_APPROVERS:-}
      MM_VERIFY_SSL: ${MM_VERIFY_SSL:-true}
      DB_URL: postgresql://${POSTGRES_USER:-mm_bot}:${POSTGRES_PASSWORD:-secret}@postgres/${POSTGRES_DB:-mm_bot_manager}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mm_bot_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mm_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm_bot} -d ${POSTGRES_DB:-mm_bot_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
