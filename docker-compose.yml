services:
  mm-bot-manager:
    build: .
    restart: unless-stopped
    stop_grace_period: ${STOP_GRACE_PERIOD:-65s}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_URL: ${MM_URL}
      MM_TOKEN: ${MM_TOKEN}
      MM_BOT_TOKEN: ${MM_BOT_TOKEN}
      MM_APPROVERS: ${MM_APPROVERS:-}
      MM_CATALOG_VIEWERS: ${MM_CATALOG_VIEWERS:-}
      MM_FEEDBACK_HANDLERS: ${MM_FEEDBACK_HANDLERS:-}
      MM_DEFAULT_LANGUAGE: ${MM_DEFAULT_LANGUAGE:-en}
      MM_DISPLAY_TIMEZONE: ${MM_DISPLAY_TIMEZONE:-UTC}
      MM_VERIFY_SSL: ${MM_VERIFY_SSL:-true}
      DB_URL: postgresql://${POSTGRES_USER:-mm_bot}:${POSTGRES_PASSWORD:-secret}@postgres/${POSTGRES_DB:-mm_bot_manager}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_WORKERS: ${MAX_WORKERS:-4}
      EVENT_QUEUE_SIZE: ${EVENT_QUEUE_SIZE:-100}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30}

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mm_bot_manager}
      POSTGRES_USER: ${POSTGRES_USER:-mm_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm_bot} -d ${POSTGRES_DB:-mm_bot_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
