apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mm-bot-manager.fullname" . }}
  labels:
    {{- include "mm-bot-manager.labels" . | nindent 4 }}
data:
  MM_URL: {{ .Values.mattermost.url | quote }}
  MM_APPROVERS: {{ .Values.mattermost.approvers | quote }}
  MM_CATALOG_VIEWERS: {{ .Values.mattermost.catalogViewers | default "" | quote }}
  MM_DEFAULT_LANGUAGE: {{ .Values.mattermost.defaultLanguage | default "en" | quote }}
  MM_VERIFY_SSL: {{ .Values.mattermost.verifySSL | toString | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  HEALTH_HOST: {{ .Values.health.host | quote }}
  HEALTH_PORT: {{ .Values.health.port | toString | quote }}
