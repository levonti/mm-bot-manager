{{- include "mm-bot-manager.validateMaintenance" . -}}
{{- $restoreFile := .Values.database.internal.restore.file }}
{{- if and (eq .Values.database.mode "internal") .Values.database.internal.restore.enabled (ne $restoreFile "") (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]*\\.dump$" $restoreFile) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mm-bot-manager.restoreFullname" . }}
  labels:
    {{- include "mm-bot-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "mm-bot-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: restore
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: restore
          image: {{ include "mm-bot-manager.postgresImage" . }}
          imagePullPolicy: {{ .Values.database.internal.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              archive="/backups/${RESTORE_FILE}"
              test -f "$archive"
              pg_restore --list "$archive" >/dev/null
              target_database="$PGDATABASE"
              case "$target_database" in
                ''|postgres|template0|template1) echo 'Refusing to replace a system database' >&2; exit 1 ;;
              esac
              export PGDATABASE=postgres
              dropdb --if-exists --force "$target_database"
              createdb "$target_database"
              pg_restore --exit-on-error --no-owner --dbname="$target_database" "$archive"
          env:
            {{- include "mm-bot-manager.postgresClientEnv" . | nindent 12 }}
            - name: RESTORE_FILE
              value: {{ $restoreFile | quote }}
          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "mm-bot-manager.backupFullname" . }}
            readOnly: true
{{- end }}
