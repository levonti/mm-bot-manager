{{- if .Values.externalSecrets.enabled }}
{{- $eso := .Values.externalSecrets }}
{{- $databaseSecret := .Values.database.external.existingSecret }}
{{- if eq .Values.database.mode "internal" }}
{{- $databaseSecret = .Values.database.internal.auth.existingSecret }}
{{- end }}
{{- if eq .Values.app.existingSecret $databaseSecret }}
{{- fail "ESO requires distinct application and database existingSecret names" }}
{{- end }}
{{- $targets := dict "app" (dict "config" $eso.app "name" .Values.app.existingSecret) "database" (dict "config" $eso.database "name" $databaseSecret) }}
{{- range $component, $target := $targets }}
{{- if $target.config.enabled }}
---
apiVersion: {{ $eso.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "mm-bot-manager.fullname" $ | trunc 50 | trimSuffix "-") $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mm-bot-manager.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}-secret
spec:
  refreshInterval: {{ $eso.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name | quote }}
    kind: {{ $eso.secretStoreRef.kind }}
  target:
    name: {{ $target.name | quote }}
    # Keep credentials when ESO is disabled or the release is uninstalled.
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    {{- range $key, $ref := $target.config.data }}
    - secretKey: {{ $key }}
      remoteRef:
        {{- toYaml $ref | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
