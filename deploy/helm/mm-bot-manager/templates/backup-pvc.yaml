{{- if and (eq .Values.database.mode "internal") .Values.database.internal.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mm-bot-manager.backupFullname" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "mm-bot-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    {{- toYaml .Values.database.internal.backup.accessModes | nindent 4 }}
  storageClassName: {{ .Values.database.internal.backup.storageClass }}
  resources:
    requests:
      storage: {{ .Values.database.internal.backup.size }}
{{- end }}
